group = 'org.apache.freemarker.onlinetester'
version = "0.1-SNAPSHOT"

ext.jarName = "${project.name}-${project.version}"

apply from: "intellij.gradle"
apply plugin: 'maven-publish'
apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'project-report'
apply plugin: 'com.gradleup.shadow'
apply plugin: "com.github.kt3k.coveralls"

project.sourceCompatibility = "17"
project.targetCompatibility = "17"

repositories {
    mavenCentral()
    maven {
        url "https://repository.apache.org/content/repositories/snapshots/"
    }
    maven {
        url "https://repository.apache.org/content/repositories/staging/"
    }
}

buildscript {
    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "org.kt3k.gradle.plugin:coveralls-gradle-plugin:2.8.3"
        classpath "com.gradleup.shadow:shadow-gradle-plugin:8.3.10"
    }
}

configurations {
    rat
}

dependencies {
    implementation libs.dropwizard
    implementation libs.dropwizard.views
    implementation libs.dropwizard.views.freemarker
    implementation libs.dropwizard.configurable.assets
    implementation libs.dropwizard.bundles.redirect
    implementation libs.freemarker
    implementation libs.commons.lang3
    implementation libs.findbugs

    testImplementation libs.dropwizard.testing
    testImplementation libs.junit
    testImplementation libs.mockito
    testImplementation libs.hamcrest
    testImplementation libs.jersey.grrizle

    rat libs.rat
}

compileJava {
    options.compilerArgs << "-Werror"
}
compileTestJava {
    options.compilerArgs << "-Werror"
}

jar {
    manifest {
        attributes 'Main-Class': 'org.apache.freemarker.onlinetester.dropwizard.FreeMarkerOnlineTester'
        attributes 'Implementation-Version': "$version"
    }
}

shadowJar {
    dependsOn jar
    archiveBaseName = "${jarName}"
    archiveVersion = ""
    mergeServiceFiles()
}

// Log full exception information on failed tests, so we see it in the Travis log:
test.testLogging {
    showStackTraces true
    exceptionFormat "full"
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}

tasks.register('rat') {
    doLast {
        ant.taskdef(
                name: 'ratReport', classname: 'org.apache.rat.anttasks.Report',
                classpath: configurations.rat.asPath)
        ant.ratReport(reportFile: "build/rat-report.txt") {
            fileset(dir: "", excludesfile: "rat-excludes")
        }
        project.logger.lifecycle('Rat reports were written into build/rat-report.txt')
    }
}

check.dependsOn jacocoTestReport
build.dependsOn shadowJar
